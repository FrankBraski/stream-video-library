<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. B's STREAM Video Library: Tag Map</title>
<style>
:root{--navy:#0b1f3a;--navy2:#13294b;--navy3:#1d3a66;--silver:#c0c6cf;--silver2:#8e98a6;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--navy);color:var(--white);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;background:rgba(11,31,58,.92);border-bottom:2px solid var(--silver)}
h1{margin:0 12px 0 0;font-size:18px;letter-spacing:.3px}h1 small{display:block;font-size:11px;color:var(--silver);font-weight:400}
#q{background:var(--navy2);color:var(--white);border:1px solid var(--silver2);border-radius:6px;padding:6px 10px;width:220px}
#q::placeholder{color:var(--silver)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{cursor:pointer;border:1px solid var(--silver);border-radius:14px;padding:3px 10px;font-size:12px;background:transparent;color:var(--white)}
.chip.on{background:var(--white);color:var(--navy);font-weight:600}
#reset{cursor:pointer;background:var(--silver);color:var(--navy);border:0;border-radius:6px;padding:5px 10px;font-weight:600}
svg{width:100%;height:100%;display:block;cursor:grab}
.link{stroke:var(--silver);stroke-linecap:round}
.node circle{stroke:var(--navy);stroke-width:1.5px;cursor:pointer}
.node.core circle{fill:var(--white);stroke:var(--silver);stroke-width:4px}
.node:not(.core) circle{fill:#6f86a8}
.node text{fill:var(--white);font-size:11px;pointer-events:none;paint-order:stroke;stroke:var(--navy);stroke-width:3px;stroke-linejoin:round}
.node.core text{font-weight:700;font-size:14px}
.dim{opacity:.08}.hl circle{stroke:var(--white)!important;stroke-width:3px}.sel circle{stroke:#ffd166!important;stroke-width:4px}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:6;background:var(--white);color:var(--navy);box-shadow:-4px 0 18px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s;overflow-y:auto;padding:16px 18px}
#panel.open{transform:none}#panel h2{margin:0 30px 4px 0;font-size:20px}#panel .meta{color:#4a5566;font-size:12px;margin-bottom:10px}
#close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--navy)}
.rel{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 14px}.rel button{cursor:pointer;border:1px solid var(--navy3);background:#eef1f5;color:var(--navy);border-radius:12px;padding:2px 9px;font-size:12px}
.rel button:hover{background:var(--navy);color:var(--white)}
.vid{border-top:1px solid #d5dae1;padding:9px 0}.vid b{display:block}.vid .by{font-size:12px;color:#4a5566}.vid p{margin:4px 0;font-size:13px}
.vid a{color:#0b3d91;font-size:12px;margin-right:10px;font-weight:600}
#legend{position:absolute;left:12px;bottom:10px;z-index:4;font-size:12px;color:var(--silver);background:rgba(11,31,58,.85);padding:6px 10px;border-radius:6px}
#tip{position:absolute;pointer-events:none;z-index:7;background:var(--white);color:var(--navy);padding:4px 8px;border-radius:4px;font-size:12px;display:none}
</style></head><body>
<header><h1>Mr. B's STREAM Video Library<small>Visual thesaurus of tags · click a tag to explore</small></h1>
<input id="q" list="taglist" placeholder="Search tags or titles…" aria-label="Search"><datalist id="taglist"></datalist>
<div class="chips" id="chips"></div><button id="reset">Reset</button></header>
<svg id="svg"></svg>
<div id="legend">● White ringed = core STREAM topic · size = # videos · line thickness = # videos shared · drag, scroll to zoom</div>
<div id="tip"></div>
<aside id="panel" aria-live="polite"><button id="close" aria-label="Close">×</button><div id="pbody"></div></aside>

const cpos=new Map(core.map((c,i)=>[c,[W/2+Math.cos(i/core.length*2*Math.PI)*Math.min(W,H)*.36,H/2+Math.sin(i/core.length*2*Math.PI)*Math.min(W,H)*.36]]));
nodes.forEach(n=>{const p=cpos.get(n.id);if(p){n.x=p[0];n.y=p[1]}});
const zoom=d3.zoom().scaleExtent([.2,6]).on('zoom',e=>{g.attr('transform',e.transform);labels(e.transform.k)});
svg.call(zoom);
const link=g.append('g').selectAll('line').data(links).join('line').attr('class','link').attr('stroke-width',d=>lw(d.w)).attr('stroke-opacity',d=>Math.min(.85,.18+d.w*.08));
const node=g.append('g').selectAll('g').data([...nodes].sort((a,b)=>a.core-b.core||a.n-b.n)).join('g').attr('class',d=>'node'+(d.core?' core':''));
node.append('circle').attr('r',d=>r(d.n)+(d.core?4:0));
node.append('text').text(d=>d.id).attr('dy',d=>-(r(d.n)+(d.core?8:4))).attr('text-anchor','middle');
function labels(k){node.select('text').style('display',d=>(d.core||d.n>=4||(k>1.5&&d.n>=2)||k>2.6)?null:'none')}labels(1);
const sim=d3.forceSimulation(nodes)
 .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>70+30/d.w).strength(l=>(l.source.core&&l.target.core)?.02:Math.min(.8,.1+.1*l.w)))
 .force('charge',d3.forceManyBody().strength(d=>d.core?-900:-90).distanceMax(600))
 .force('collide',d3.forceCollide(d=>r(d.n)+(d.core?10:3)).strength(.8))
 .force('x',d3.forceX(d=>cpos.has(d.id)?cpos.get(d.id)[0]:W/2).strength(d=>d.core?.9:.02))
 .force('y',d3.forceY(d=>cpos.has(d.id)?cpos.get(d.id)[1]:H/2).strength(d=>d.core?.9:.02))
 .force('home',homeForce()).velocityDecay(.22).alphaDecay(.02);
// spring back to a resting "home" once the layout has settled
function homeForce(){let ns;const f=a=>{for(const n of ns){if(n.hx==null||n.fx!=null)continue;n.vx+=(n.hx-n.x)*.06;n.vy+=(n.hy-n.y)*.06}};f.initialize=x=>ns=x;return f}
let homed=false;
sim.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);
 if(!homed&&sim.alpha()<.06){homed=true;nodes.forEach(n=>{n.hx=n.x;n.hy=n.y});startWobble()}});
function startWobble(){let t=0;d3.interval(()=>{t+=.05;nodes.forEach((n,i)=>{n.vx+=Math.sin(t+i)*.06;n.vy+=Math.cos(t*1.3+i*.7)*.06});if(sim.alpha()<.03)sim.alpha(.03).restart()},50)}
node.call(d3.drag().on('start',(e,d)=>{sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
 .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{sim.alphaTarget(0);d.fx=d.fy=null;sim.alpha(.5).restart()}));
const tip=d3.select('#tip');
node.on('mouseover',(e,d)=>{highlight(d.id);tip.style('display','block').html(`<b>${esc(d.id)}</b> · ${d.n} video${d.n>1?'s':''}`)})
 .on('mousemove',e=>tip.style('left',e.pageX+12+'px').style('top',e.pageY+12+'px'))
 .on('mouseout',()=>{tip.style('display','none');applyFilter()})
 .on('click',(e,d)=>{e.stopPropagation();openPanel(d.id)});
function highlight(id){const nb=nbr.get(id);node.classed('dim',n=>n.id!==id&&!nb.has(n.id)).classed('hl',n=>n.id===id);link.classed('dim',l=>l.source.id!==id&&l.target.id!==id)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let selected=null;
function openPanel(id){const d=byId.get(id);selected=id;node.classed('sel',n=>n.id===id);
 const rel=[...nbr.get(id)].sort((a,b)=>b[1]-a[1]||byId.get(b[0]).n-byId.get(a[0]).n).slice(0,30);
 const vs=d.v.map(i=>videos[i]).sort((a,b)=>b.d.localeCompare(a.d));
 d3.select('#pbody').html(`<h2>${esc(id)}</h2><div class="meta">${d.core?'Core STREAM topic · ':''}${d.n} video${d.n>1?'s':''} · ${nbr.get(id).size} related tags</div>
 <div><b>Related tags</b></div><div class="rel">${rel.map(([t,w])=>`<button data-t="${esc(t)}" title="${w} shared">${esc(t)} (${w})</button>`).join('')}</div>
 <div><b>Videos</b></div>${vs.map(v=>`<div class="vid"><b>${esc(v.t)}</b><span class="by">${esc(v.c)} · ${esc(v.d)}</span><p>${esc(v.s)}</p>
 ${v.u?`<a href="${esc(v.u)}" target="_blank" rel="noopener">▶ Original</a>`:''}${v.z?`<a href="https://drive.google.com/file/d/${esc(v.z)}/view" target="_blank" rel="noopener">⬇ Drive zip</a>`:''}</div>`).join('')}`);
 d3.selectAll('#pbody .rel button').on('click',function(){openPanel(this.dataset.t);focus(this.dataset.t)});
 d3.select('#panel').classed('open',true)}
function focus(id){const d=byId.get(id);if(!d)return;svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity.translate(W/2-80,H/2).scale(1.6).translate(-d.x,-d.y))}
d3.select('#close').on('click',()=>{d3.select('#panel').classed('open',false);selected=null;node.classed('sel',false)});
svg.on('click',()=>d3.select('#close').dispatch('click'));
// filters
const on=new Set();
d3.select('#chips').selectAll('button').data(core).join('button').attr('class','chip').text(d=>d)
 .on('click',function(e,c){on.has(c)?on.delete(c):on.add(c);d3.select(this).classed('on',on.has(c));applyFilter()});
let query='';
d3.select('#taglist').selectAll('option').data(nodes).join('option').attr('value',d=>d.id);
d3.select('#q').on('input',function(){query=this.value.trim().toLowerCase();applyFilter()}).on('change',function(){const n=byId.get(this.value);if(n){openPanel(n.id);focus(n.id)}});
function visibleVideos(){return videos.map((v,i)=>i).filter(i=>{const v=videos[i];
 if(on.size&&![...on].every(c=>v.g.includes(c)))return false;
 if(query&&!(v.t.toLowerCase().includes(query)||v.g.some(t=>t.toLowerCase().includes(query))))return false;return true})}
function applyFilter(){if(!on.size&&!query){node.classed('dim',false).classed('hl',false);link.classed('dim',false);return}
 const vv=new Set(visibleVideos());const keep=new Set(nodes.filter(n=>n.v.some(i=>vv.has(i))&&(!query||n.id.toLowerCase().includes(query)||on.size||true)).map(n=>n.id));
 node.classed('hl',n=>query&&n.id.toLowerCase().includes(query)).classed('dim',n=>!keep.has(n.id));link.classed('dim',l=>!(keep.has(l.source.id)&&keep.has(l.target.id)))}
d3.select('#reset').on('click',()=>{on.clear();query='';d3.select('#q').property('value','');d3.selectAll('.chip').classed('on',false);applyFilter();svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity)});
</script></body></html>
